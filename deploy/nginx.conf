events {}

http {
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    client_max_body_size 60m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Do not route scanner probes for repository/config dotfiles into the SPA.
    # Keep the ACME namespace available for the planned HTTPS rollout.
    location ~ /\.(?!well-known/) {
      return 404;
    }

    # The backend disables interactive API documentation in production. Keep
    # the SPA fallback from turning those well-known scanner targets into 200s.
    location = /openapi.json { return 404; }
    location = /docs { return 404; }
    location ^~ /docs/ { return 404; }
    location = /redoc { return 404; }
    location ^~ /redoc/ { return 404; }

    location = /health {
      proxy_pass http://api:8000/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 900s;
    }

    # Move cached links from the retired application to a cache-busted Easy
    # Teach entry point. The query prevents reuse of the old cached HTML.
    location = /academic-support {
      return 302 /?retired=academic-support-20260911;
    }
    location ^~ /academic-support/ {
      return 302 /?retired=academic-support-20260911;
    }

    location / {
      # Use the project-scoped name to avoid future cross-project DNS aliases.
      proxy_pass http://easy-teach-web-1:80;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
