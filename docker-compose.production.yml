services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easy_teach}
      POSTGRES_USER: ${POSTGRES_USER:-easy_teach}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-easy_teach}
      DATABASE_USER: ${POSTGRES_USER:-easy_teach}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      TASK_QUEUE_ENABLED: "true"
      TASK_QUEUE_EAGER: "false"
      TASK_MAX_RETRIES: ${TASK_MAX_RETRIES:-2}
      TASK_TIME_LIMIT_SECONDS: ${TASK_TIME_LIMIT_SECONDS:-900}
      TASK_SOFT_TIME_LIMIT_SECONDS: ${TASK_SOFT_TIME_LIMIT_SECONDS:-840}
      DEBUG: "false"
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost"]}'
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-300}
      RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE: ${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:-60}
      DAILY_MODEL_REQUEST_LIMIT: ${DAILY_MODEL_REQUEST_LIMIT:-200}
      MAX_CONCURRENT_TASKS_PER_USER: ${MAX_CONCURRENT_TASKS_PER_USER:-8}
      STORAGE_QUOTA_MB_PER_USER: ${STORAGE_QUOTA_MB_PER_USER:-1024}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      GENERATED_DIR: /app/data/generated
      CHROMA_PERSIST_DIR: /app/data/chroma
      ANONYMIZED_TELEMETRY: "false"
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      SPEECH_MAX_UPLOAD_SIZE_MB: ${SPEECH_MAX_UPLOAD_SIZE_MB:-25}
      VIDEO_PARSER_OUTPUT_DIR: /app/data/video-parser
      VIDEO_PARSER_ENABLED: ${VIDEO_PARSER_ENABLED:-false}
    command: ["sh", "-c", "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - app_data:/app/data
    secrets:
      - deepseek_api_key
      - jwt_secret_key
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-easy_teach}
      DATABASE_USER: ${POSTGRES_USER:-easy_teach}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      TASK_QUEUE_ENABLED: "true"
      TASK_QUEUE_EAGER: "false"
      TASK_MAX_RETRIES: ${TASK_MAX_RETRIES:-2}
      TASK_TIME_LIMIT_SECONDS: ${TASK_TIME_LIMIT_SECONDS:-900}
      TASK_SOFT_TIME_LIMIT_SECONDS: ${TASK_SOFT_TIME_LIMIT_SECONDS:-840}
      DEBUG: "false"
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost"]}'
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-300}
      RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE: ${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:-60}
      DAILY_MODEL_REQUEST_LIMIT: ${DAILY_MODEL_REQUEST_LIMIT:-200}
      MAX_CONCURRENT_TASKS_PER_USER: ${MAX_CONCURRENT_TASKS_PER_USER:-8}
      STORAGE_QUOTA_MB_PER_USER: ${STORAGE_QUOTA_MB_PER_USER:-1024}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      GENERATED_DIR: /app/data/generated
      CHROMA_PERSIST_DIR: /app/data/chroma
      ANONYMIZED_TELEMETRY: "false"
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      SPEECH_MAX_UPLOAD_SIZE_MB: ${SPEECH_MAX_UPLOAD_SIZE_MB:-25}
      VIDEO_PARSER_OUTPUT_DIR: /app/data/video-parser
      VIDEO_PARSER_ENABLED: ${VIDEO_PARSER_ENABLED:-false}
      VIDEO_PARSER_TRANSCRIBE: ${VIDEO_PARSER_TRANSCRIBE:-false}
      VIDEO_PARSER_OCR: ${VIDEO_PARSER_OCR:-false}
      VIDEO_PARSER_VISION: ${VIDEO_PARSER_VISION:-false}
      VIDEO_PARSER_UNDERSTANDING: ${VIDEO_PARSER_UNDERSTANDING:-false}
      VIDEO_PARSER_TYPE: ${VIDEO_PARSER_TYPE:-auto}
      VIDEO_PARSER_MAX_KEYFRAMES: ${VIDEO_PARSER_MAX_KEYFRAMES:-12}
      VIDEO_PARSER_MAX_SHOTS: ${VIDEO_PARSER_MAX_SHOTS:-36}
      VIDEO_PARSER_OUTPUT_WIDTH: ${VIDEO_PARSER_OUTPUT_WIDTH:-960}
      VIDEO_PARSER_MAX_DURATION_SECONDS: ${VIDEO_PARSER_MAX_DURATION_SECONDS:-3600}
      VIDEO_PARSER_TASK_TIME_LIMIT_SECONDS: ${VIDEO_PARSER_TASK_TIME_LIMIT_SECONDS:-1800}
      VIDEO_PARSER_TASK_SOFT_TIME_LIMIT_SECONDS: ${VIDEO_PARSER_TASK_SOFT_TIME_LIMIT_SECONDS:-1740}
      VIDEO_PARSER_DAILY_USER_LIMIT: ${VIDEO_PARSER_DAILY_USER_LIMIT:-10}
      BAILIAN_API_KEY_FILE: /run/secrets/bailian_api_key
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VIDEO_MODEL: ${VIDEO_MODEL:-qwen3.7-plus}
      VIDEO_INPUT_MODE: ${VIDEO_INPUT_MODE:-file_url}
      VIDEO_FPS: ${VIDEO_FPS:-1.0}
      VIDEO_MAX_FRAMES: ${VIDEO_MAX_FRAMES:-1800}
      VIDEO_CHUNK_SECONDS: ${VIDEO_CHUNK_SECONDS:-1800}
      VIDEO_CHUNK_OVERLAP_SECONDS: ${VIDEO_CHUNK_OVERLAP_SECONDS:-15}
      VIDEO_MAX_CHUNKS: ${VIDEO_MAX_CHUNKS:-4}
      VIDEO_TIMEOUT_SECONDS: ${VIDEO_TIMEOUT_SECONDS:-300}
      VIDEO_MAX_RETRIES: ${VIDEO_MAX_RETRIES:-1}
      VIDEO_MAX_OUTPUT_TOKENS: ${VIDEO_MAX_OUTPUT_TOKENS:-4096}
      VIDEO_MAX_BASE64_BYTES: ${VIDEO_MAX_BASE64_BYTES:-12582912}
      VIDEO_STRICT_SCHEMA: ${VIDEO_STRICT_SCHEMA:-true}
      VIDEO_CACHE_ENABLED: ${VIDEO_CACHE_ENABLED:-true}
      VIDEO_PROMPT_VERSION: ${VIDEO_PROMPT_VERSION:-video-understanding-v1}
      VIDEO_SCHEMA_VERSION: ${VIDEO_SCHEMA_VERSION:-video-understanding-v1}
      VIDEO_MAX_REFINEMENT_INTERVALS: ${VIDEO_MAX_REFINEMENT_INTERVALS:-6}
      VIDEO_MAX_REFINEMENT_FRAMES: ${VIDEO_MAX_REFINEMENT_FRAMES:-12}
      VIDEO_MAX_VISUAL_FRAMES_PER_INTERVAL: ${VIDEO_MAX_VISUAL_FRAMES_PER_INTERVAL:-4}
      VIDEO_PARSER_VISION_MAX_KEYFRAMES: ${VIDEO_PARSER_VISION_MAX_KEYFRAMES:-4}
      BAILIAN_VISION_MODEL: ${BAILIAN_VISION_MODEL:-qwen3.7-plus}
      BAILIAN_VISION_TIMEOUT_SECONDS: ${BAILIAN_VISION_TIMEOUT_SECONDS:-90}
      BAILIAN_VISION_MAX_RETRIES: ${BAILIAN_VISION_MAX_RETRIES:-1}
      BAILIAN_VISION_MAX_OUTPUT_TOKENS: ${BAILIAN_VISION_MAX_OUTPUT_TOKENS:-1800}
    command: ["celery", "-A", "backend.celery_app.celery_app", "worker", "--beat", "--loglevel=INFO", "--concurrency=1"]
    volumes:
      - app_data:/app/data
    secrets:
      - bailian_api_key
      - deepseek_api_key
      - jwt_secret_key
      - postgres_password
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  app_data:

secrets:
  bailian_api_key:
    file: ${BAILIAN_API_KEY_SECRET_FILE:?set BAILIAN_API_KEY_SECRET_FILE}
  deepseek_api_key:
    file: ${DEEPSEEK_API_KEY_SECRET_FILE:?set DEEPSEEK_API_KEY_SECRET_FILE}
  jwt_secret_key:
    file: ${JWT_SECRET_KEY_SECRET_FILE:?set JWT_SECRET_KEY_SECRET_FILE}
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:?set POSTGRES_PASSWORD_SECRET_FILE}
