<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">托托挠头思考状态</title>
  <desc id="desc">托托抬手挠头思考项目任务，右上角显示省略号。</desc>
  <g id="mascot">
    <ellipse id="shadow" cx="256" cy="438" rx="112" ry="14" fill="#25434A" opacity=".12"/>
    <g id="folder-tab">
      <path d="M166 151C166 132 181 117 200 117H254L279 144H342C361 144 376 159 376 178V195H166V151Z" fill="#0F8D76" stroke="#25434A" stroke-width="10" stroke-linejoin="round"/>
    </g>
    <g id="body">
      <rect x="116" y="154" width="280" height="270" rx="58" fill="#9ACED1" stroke="#25434A" stroke-width="10"/>
      <path d="M150 338C190 365 322 365 362 338V376C362 395 347 410 328 410H184C165 410 150 395 150 376V338Z" fill="#72B5BC" opacity=".8"/>
    </g>
    <g id="arm-left" fill="none" stroke="#25434A" stroke-width="12" stroke-linecap="round">
      <path d="M122 292C94 294 82 316 92 339C100 357 115 362 130 354"/>
      <circle cx="91" cy="340" r="8" fill="#FFB547" stroke="none"/>
    </g>
    <g id="arm-right" fill="none" stroke="#25434A" stroke-width="12" stroke-linecap="round">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" values="0 390 302;-9 390 302;5 390 302;-7 390 302;0 390 302" dur="1.55s" repeatCount="indefinite"/>
      <path d="M390 302C416 290 413 248 393 215C377 188 354 171 330 155"/>
      <circle cx="329" cy="154" r="8" fill="#FFB547" stroke="none"/>
      <path d="M320 145L314 137M331 141L330 132" stroke="#FFB547" stroke-width="6"/>
    </g>
    <g id="face">
      <rect x="165" y="190" width="182" height="106" rx="48" fill="#FFFFFF"/>
    </g>
    <circle id="eye-left" cx="216" cy="229" r="12" fill="#25434A"/>
    <circle id="eye-right" cx="296" cy="222" r="12" fill="#25434A"/>
    <path id="mouth" d="M242 268C250 264 261 264 270 268" fill="none" stroke="#25434A" stroke-width="8" stroke-linecap="round"/>
    <g id="progress">
      <rect x="190" y="330" width="132" height="30" rx="15" fill="#FFFFFF" opacity=".9"/>
      <circle cx="211" cy="345" r="7" fill="#FFB547"/>
      <circle cx="256" cy="345" r="7" fill="#FFB547" opacity=".65"/>
      <circle cx="301" cy="345" r="7" fill="#FFB547" opacity=".3"/>
    </g>
    <g id="badge">
