      <circle cx="341" cy="174" r="3.5" fill="#FFFFFF"/>
      <circle cx="351" cy="174" r="3.5" fill="#FFFFFF"/>
      <circle cx="361" cy="174" r="3.5" fill="#FFFFFF"/>
