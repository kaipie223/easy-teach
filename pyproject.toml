[project]
name = "easy-teach"
version = "0.1.0"
description = "Multimodal AI teaching co-creation platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic==1.13.2",
  "aiofiles==24.1.0",
  "argon2-cffi==23.1.0",
  "chromadb==0.5.3",
  "fastapi==0.141.1",
  "faster-whisper==1.0.3",
  "httpx==0.27.0",
  "langchain-text-splitters==1.1.2",
  "openai==1.35.3",
  "Pillow==12.3.0",
  "opencv-python-headless>=4,<5",
  "opencc-python-reimplemented>=0.1.7,<1",
  "PyJWT==2.13.0",
  "psycopg[binary]==3.2.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "PyMuPDF==1.24.7",
  "python-docx==1.1.2",
  "python-multipart==0.0.32",
  "python-pptx==0.6.23",
  "redis==5.0.7",
  "sqlalchemy==2.0.30",
  "python-dotenv>=1.0,<2",
  "tencentcloud-sdk-python>=3.1.138,<4",
  "jsonschema>=4.21,<5",
  "dashscope>=1.20,<2",
  "uvicorn[standard]==0.30.1",
  "celery[redis]==5.4.0",
  "fastembed>=0.7,<1",
  "email-validator>=2.2,<3",
]

[dependency-groups]
dev = [
  "pytest==8.2.2",
  "pytest-asyncio==0.23.7",
  "ruff==0.5.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
