[project]
name = "easy-teach"
version = "0.1.0"
description = "Multimodal AI teaching co-creation platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic==1.13.2",
  "aiofiles==24.1.0",
  "argon2-cffi==23.1.0",
  "chromadb==0.5.3",
  "fastapi==0.111.0",
  "faster-whisper==1.0.3",
  "httpx==0.27.0",
  "langchain==0.2.6",
  "langchain-community==0.2.6",
  "langchain-text-splitters==0.2.2",
  "openai==1.35.3",
  "Pillow==10.3.0",
  "PyJWT==2.8.0",
  "psycopg[binary]==3.2.1",
  "pydantic==2.7.4",
  "pydantic-settings==2.3.4",
  "PyMuPDF==1.24.7",
  "PyPDF2==3.0.1",
  "python-docx==1.1.2",
  "python-multipart==0.0.9",
  "python-pptx==0.6.23",
  "redis==5.0.7",
  "sentence-transformers>=2.6.0",
  "sqlalchemy==2.0.30",
  "uvicorn[standard]==0.30.1",
]

[dependency-groups]
dev = [
  "pytest==8.2.2",
  "pytest-asyncio==0.23.7",
  "ruff==0.5.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
